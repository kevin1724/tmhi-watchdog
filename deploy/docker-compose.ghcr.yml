services:
  tmhi-watchdog:
    image: ghcr.io/kevin1724/tmhi-watchdog:latest
    pull_policy: always
    container_name: tmhi-watchdog
    restart: unless-stopped
    env_file:
      - ../.env
    ports:
      - "${WEB_PORT:-8088}:8000"
    volumes:
      - tmhi_watchdog_data:/data
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

volumes:
  tmhi_watchdog_data:

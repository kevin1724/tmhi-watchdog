# Optional advanced example: store watchdog.db in ./data instead of a named volume.
# Before starting, run:
#   mkdir -p data
#   sudo chown -R 10001:10001 data
services:
  tmhi-watchdog:
    build: ..
    image: tmhi-watchdog:local
    container_name: tmhi-watchdog
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-8088}:8000"
    volumes:
      - ../data:/data
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

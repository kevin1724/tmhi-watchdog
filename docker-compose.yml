services:
  tmhi-watchdog:
    build: .
    image: tmhi-watchdog:local
    container_name: tmhi-watchdog
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-8088}:8000"
    volumes:
      - tmhi_watchdog_data:/data
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

volumes:
  tmhi_watchdog_data:
